name: UQOS Native SIG-TD CI

on:
  push:
    paths:
      - 'plugins/uqos-security/native/**'
      - 'plugins/uqos-security/scripts/neural_symbolic_projection.py'
      - 'plugins/uqos-security/scripts/verify_ebpf_artifact.py'
      - 'plugins/uqos-security/tests/test_neural_symbolic_projection.py'
  pull_request:
    paths:
      - 'plugins/uqos-security/native/**'
      - 'plugins/uqos-security/scripts/neural_symbolic_projection.py'
      - 'plugins/uqos-security/scripts/verify_ebpf_artifact.py'
      - 'plugins/uqos-security/tests/test_neural_symbolic_projection.py'

jobs:
  rust-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native verifier
        run: cargo test --manifest-path plugins/uqos-security/native/Cargo.toml

  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: PYTHONPATH=plugins/uqos-security/scripts python -m pytest plugins/uqos-security/tests/test_neural_symbolic_projection.py -q
