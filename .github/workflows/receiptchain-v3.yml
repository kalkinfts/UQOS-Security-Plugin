name: ReceiptChain v3
on:
  push:
    branches: [main, "feat/receiptchain-v3"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiptchain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q plugins
      - name: Run ReceiptChain regression suite
        run: python -m unittest discover -s plugins/uqos-security/tests -p "test_receiptchain_v3.py" -v
